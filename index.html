<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Kiosk</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="kiosk">
        <!-- 왼쪽 영역: 매뉴 선택-->
         <section class="menu-area">
            <header class ="kiosk-header">
                <h1 >Cafe Kiosk</h1>
                <p>원하는 메뉴를 선택해주세요.</p>
            </header>

            <nav class="tabs"></nav>
            <div class="menu-grid"></div>

         </section>

        <!-- 오른쪽 영역: 주문 내역 -->
        <aside class="order-area">
            <h2 class="order title">주문 내역 </h2>
            <div class="place-row">
                <button class ="place-btn active" type="button" data-place="매장"> 🤪매장에서</button>
                <button class ="place-btn" type="button" data-place="포장"> 🚶‍♂️‍➡️포장</button>
            </div>

            <ul class="cart-list"></ul>
            <p class="empty-msg">주문 내역이 없습니다.<br> 원하는 메뉴를 선택해주세요.</p>

            <div class="total-box">
                <span class="total-label">총 주문금액  </span>
                <span class="total-price">0원</span>
            </div>
            <p class="total-count">총 0개</p>

            <div class="btn-row">
                <button class="clear-btn" type="button">전체 취소</button>
                <button class="order-btn" type="button">주문하기</button>
            </div>
        </aside>

    </main>


    <div class="modal">
        <div class="modal-box">
            <div class="modal-icon">🚀</div>
            <h2>주문이 완료되었습니다.</h2>
            <p class="modal-place"></p>

            <div class="modal-number"></div>
            <ul class="receipt"></ul>

            <p class="modal-total"></p>
            <button class="modal-close" type="button">확인</button>
        </div>

    </div>

    <script src="js/script.js"></script>
    
</body>
</html>
